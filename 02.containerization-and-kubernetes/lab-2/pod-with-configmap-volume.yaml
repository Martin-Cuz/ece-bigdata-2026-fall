apiVersion: v1
kind: Pod
metadata:
  name: spark-config-reader
spec:
  containers:
  - name: spark
    image: apache/spark:latest
    command: ["sleep", "600"]
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
  - name: config-volume
    configMap:
      name: data-platform-config
      items:
      - key: application.yaml
        path: application.yaml
      - key: table_mappings.csv
        path: tables.csv
